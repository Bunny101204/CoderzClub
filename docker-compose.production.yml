services:
  api:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: api
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SPRING_REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?set RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      APP_BACKEND_URL: ${APP_BACKEND_URL:?set APP_BACKEND_URL}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:?set APP_FRONTEND_URL}
      SUBMISSION_LIMIT_DAILY: ${SUBMISSION_LIMIT_DAILY:-100}
      SUBMISSION_LIMIT_PER_PROBLEM_DAILY: ${SUBMISSION_LIMIT_PER_PROBLEM_DAILY:-50}
      SUBMISSION_LIMIT_COOLDOWN_MS: ${SUBMISSION_LIMIT_COOLDOWN_MS:-2000}
      SUBMISSION_LIMIT_REDIS_FAIL_OPEN: ${SUBMISSION_LIMIT_REDIS_FAIL_OPEN:-false}
      SUBMISSION_LIMIT_TIME_ZONE: ${SUBMISSION_LIMIT_TIME_ZONE:-UTC}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:?set APP_CORS_ALLOWED_ORIGINS}
    ports: ["8080:8080"]
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
  worker:
    build: ./backend
    environment:
      SPRING_PROFILES_ACTIVE: worker
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SPRING_REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?set RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      WORKER_ENABLED: "true"
      SUBMISSION_LIMIT_DAILY: ${SUBMISSION_LIMIT_DAILY:-100}
      SUBMISSION_LIMIT_PER_PROBLEM_DAILY: ${SUBMISSION_LIMIT_PER_PROBLEM_DAILY:-50}
      SUBMISSION_LIMIT_COOLDOWN_MS: ${SUBMISSION_LIMIT_COOLDOWN_MS:-2000}
      SUBMISSION_LIMIT_REDIS_FAIL_OPEN: ${SUBMISSION_LIMIT_REDIS_FAIL_OPEN:-false}
      SUBMISSION_LIMIT_TIME_ZONE: ${SUBMISSION_LIMIT_TIME_ZONE:-UTC}
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
        reservations: { cpus: "0.5", memory: 512M }
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?set RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts.yml:/etc/prometheus/alerts.yml:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    environment:
      REDIS_ADDR: redis://redis:6379
  rabbitmq-exporter:
    image: kbudde/rabbitmq-exporter:v1.0.0-RC19
    environment:
      RABBIT_URL: http://rabbitmq:15672
      RABBIT_USER: ${RABBITMQ_USERNAME:?set RABBITMQ_USERNAME}
      RABBIT_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
volumes:
  redis-data:
  rabbitmq-data:
