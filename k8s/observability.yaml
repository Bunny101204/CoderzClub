apiVersion: v1
kind: ConfigMap
metadata:
  name: coderzclub-prometheus-config
  namespace: coderzclub
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files: [/etc/prometheus/alerts.yml]
    scrape_configs:
      - job_name: coderzclub-api
        metrics_path: /actuator/prometheus
        static_configs:
          - targets: [coderzclub-api-metrics:8081]
  alerts.yml: |
    groups:
      - name: coderzclub-production
        rules:
          - alert: SubmissionQueueDepthHigh
            expr: submission_queue_depth >= 9000
            for: 5m
          - alert: SubmissionDlqNotEmpty
            expr: submission_queue_dlq_depth > 0
            for: 2m
          - alert: SubmissionQueueOldestJobTooOld
            expr: submission_queue_oldest_message_age_seconds > 300
            for: 5m
          - alert: RedisUnavailable
            expr: increase(dependency_errors_total{dependency="redis"}[5m]) > 0
            for: 2m
          - alert: RabbitMQUnavailable
            expr: increase(dependency_errors_total{dependency="broker"}[5m]) > 0
            for: 2m
          - alert: Judge0RateLimitedOrFailing
            expr: increase(judge0_http_error_total{status=~"429|5.."}[5m]) > 10
            for: 5m
          - alert: SubmissionWorkerLeaseLossHigh
            expr: increase(submission_worker_lease_loss_total[10m]) > 3
            for: 5m
          - alert: ApiP95LatencyHigh
            expr: histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{uri!~"/actuator/.*"}[5m]))) > 1
            for: 10m
          - alert: ApiP99LatencyHigh
            expr: histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{uri!~"/actuator/.*"}[5m]))) > 2
            for: 10m
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coderzclub-prometheus
  namespace: coderzclub
spec:
  replicas: 1
  selector:
    matchLabels: { app: coderzclub-prometheus }
  template:
    metadata:
      labels: { app: coderzclub-prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.53.0
          args: [--config.file=/etc/prometheus/prometheus.yml]
          ports: [{ name: http, containerPort: 9090 }]
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: config
          configMap: { name: coderzclub-prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: coderzclub-prometheus
  namespace: coderzclub
spec:
  selector: { app: coderzclub-prometheus }
  ports: [{ port: 9090, targetPort: http }]
