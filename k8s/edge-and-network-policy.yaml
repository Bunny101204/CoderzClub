apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coderzclub
  namespace: coderzclub
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: 2m
    nginx.ingress.kubernetes.io/limit-rps: "20"
    nginx.ingress.kubernetes.io/limit-burst-multiplier: "3"
    nginx.ingress.kubernetes.io/enable-modsecurity: "true"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [coderzclub.example.com]
      secretName: coderzclub-tls
  rules:
    - host: coderzclub.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coderzclub-api
                port: { number: 80 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: coderzclub-management-metrics
  namespace: coderzclub
spec:
  podSelector:
    matchLabels: { app: coderzclub-api }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: coderzclub-prometheus } }
      ports:
        - { protocol: TCP, port: 8081 }
