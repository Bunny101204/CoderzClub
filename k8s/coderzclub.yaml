apiVersion: v1
kind: Namespace
metadata: { name: coderzclub }
---
apiVersion: v1
kind: Secret
metadata: { name: coderzclub-secrets, namespace: coderzclub }
type: Opaque
stringData:
  MONGODB_URI: replace-me
  JWT_SECRET: replace-me
  RABBITMQ_USERNAME: replace-me
  RABBITMQ_PASSWORD: replace-me
  RABBITMQ_CONNECTION_STRING: amqp://replace-me:replace-me@coderzclub-rabbitmq:5672/
---
apiVersion: v1
kind: ConfigMap
metadata: { name: coderzclub-submission-limits, namespace: coderzclub }
data:
  SUBMISSION_LIMIT_DAILY: "100"
  SUBMISSION_LIMIT_PER_PROBLEM_DAILY: "50"
  SUBMISSION_LIMIT_COOLDOWN_MS: "2000"
  SUBMISSION_LIMIT_REDIS_FAIL_OPEN: "false"
  SUBMISSION_LIMIT_TIME_ZONE: UTC
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: coderzclub-api, namespace: coderzclub }
spec:
  replicas: 3
  selector: { matchLabels: { app: coderzclub-api } }
  template:
    metadata: { labels: { app: coderzclub-api } }
    spec:
      containers:
        - name: api
          image: ghcr.io/bunny101204/coderzclub-backend:replace-me
          envFrom:
            - { secretRef: { name: coderzclub-secrets } }
            - { configMapRef: { name: coderzclub-submission-limits } }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: api }
            - { name: MANAGEMENT_SERVER_PORT, value: "8081" }
            - { name: SPRING_REDIS_HOST, value: coderzclub-redis }
            - { name: RABBITMQ_HOST, value: coderzclub-rabbitmq }
            - { name: APP_BACKEND_URL, value: https://coderzclub.example.com }
            - { name: APP_FRONTEND_URL, value: https://coderzclub.example.com }
            - { name: APP_CORS_ALLOWED_ORIGINS, value: https://coderzclub.example.com }
          ports: [{ name: http, containerPort: 8080 }, { name: management, containerPort: 8081 }]
          readinessProbe: { httpGet: { path: /actuator/health/readiness, port: management }, initialDelaySeconds: 15 }
          livenessProbe: { httpGet: { path: /actuator/health/liveness, port: management }, initialDelaySeconds: 30 }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: coderzclub-api, namespace: coderzclub }
spec:
  selector: { app: coderzclub-api }
  ports: [{ port: 80, targetPort: http }]
---
apiVersion: v1
kind: Service
metadata: { name: coderzclub-api-metrics, namespace: coderzclub }
spec:
  selector: { app: coderzclub-api }
  ports: [{ name: management, port: 8081, targetPort: management }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: coderzclub-worker, namespace: coderzclub }
spec:
  replicas: 2
  selector: { matchLabels: { app: coderzclub-worker } }
  template:
    metadata: { labels: { app: coderzclub-worker } }
    spec:
      containers:
        - name: worker
          image: ghcr.io/bunny101204/coderzclub-backend:replace-me
          envFrom:
            - { secretRef: { name: coderzclub-secrets } }
            - { configMapRef: { name: coderzclub-submission-limits } }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: worker }
            - { name: WORKER_ENABLED, value: "true" }
            - { name: KEDA_RABBITMQ_HOST, valueFrom: { secretKeyRef: { name: coderzclub-secrets, key: RABBITMQ_CONNECTION_STRING } } }
            - { name: SPRING_REDIS_HOST, value: coderzclub-redis }
            - { name: RABBITMQ_HOST, value: coderzclub-rabbitmq }
          resources: { requests: { cpu: 500m, memory: 512Mi }, limits: { cpu: "2", memory: 2Gi } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: coderzclub-api, namespace: coderzclub }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: coderzclub-api }
  minReplicas: 3
  maxReplicas: 20
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 65 } } }]
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata: { name: coderzclub-worker-rabbitmq, namespace: coderzclub }
spec:
  secretTargetRef:
    - { parameter: host, name: coderzclub-secrets, key: RABBITMQ_CONNECTION_STRING }
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata: { name: coderzclub-worker, namespace: coderzclub }
spec:
  scaleTargetRef: { name: coderzclub-worker }
  minReplicaCount: 2
  maxReplicaCount: 30
  pollingInterval: 15
  cooldownPeriod: 300
  triggers:
    - type: rabbitmq
      metadata:
        queueName: coderzclub.submissions
        mode: QueueLength
        value: "20"
        activationValue: "5"
      authenticationRef: { name: coderzclub-worker-rabbitmq }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: coderzclub-redis, namespace: coderzclub }
spec:
  replicas: 1
  selector: { matchLabels: { app: coderzclub-redis } }
  template:
    metadata: { labels: { app: coderzclub-redis } }
    spec: { containers: [{ name: redis, image: redis:7.2-alpine, resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: 500m, memory: 512Mi } } }] }
---
apiVersion: v1
kind: Service
metadata: { name: coderzclub-redis, namespace: coderzclub }
spec: { selector: { app: coderzclub-redis }, ports: [{ port: 6379 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: coderzclub-rabbitmq, namespace: coderzclub }
spec:
  replicas: 1
  selector: { matchLabels: { app: coderzclub-rabbitmq } }
  template:
    metadata: { labels: { app: coderzclub-rabbitmq } }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management
          env:
            - name: RABBITMQ_DEFAULT_USER
              valueFrom: { secretKeyRef: { name: coderzclub-secrets, key: RABBITMQ_USERNAME } }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: coderzclub-secrets, key: RABBITMQ_PASSWORD } }
          readinessProbe: { exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }, initialDelaySeconds: 10, periodSeconds: 5 }
          resources: { requests: { cpu: 250m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }
---
apiVersion: v1
kind: Service
metadata: { name: coderzclub-rabbitmq, namespace: coderzclub }
spec: { selector: { app: coderzclub-rabbitmq }, ports: [{ port: 5672 }, { port: 15672 }] }
