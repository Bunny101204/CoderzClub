# Isolated LOCAL problem-bank staging. Project: cz-pb-staging
# Does not share volumes, networks, credentials, or ports with production,
# GCP staging, perf, e2e, or the stopped historical containers.
# Host binds are loopback-only.
name: cz-pb-staging

services:
  mongo:
    image: mongo:7.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - cz_pb_staging_mongo:/data/db
    ports:
      - "127.0.0.1:27029:27017"
    networks: [cz_pb_staging_net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 30

  mongo-init:
    image: mongo:7.0
    depends_on:
      mongo:
        condition: service_healthy
    networks: [cz_pb_staging_net]
    restart: "no"
    entrypoint:
      - bash
      - -lc
      - |
        set -e
        until mongosh --host mongo:27017 --quiet --eval 'db.adminCommand({ping:1}).ok' | grep -q 1; do sleep 1; done
        mongosh --host mongo:27017 --quiet --eval 'try { rs.status().ok } catch (e) { rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]}) }'

  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "pb_staging_redis_only_local"]
    volumes:
      - cz_pb_staging_redis:/data
    networks: [cz_pb_staging_net]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "pb_staging_redis_only_local", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: pb_staging_user
      RABBITMQ_DEFAULT_PASS: pb_staging_rabbit_only_local
      RABBITMQ_DEFAULT_VHOST: /cz-pb-staging
    volumes:
      - cz_pb_staging_rabbit:/var/lib/rabbitmq
    networks: [cz_pb_staging_net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  judge-db:
    image: postgres:13
    environment:
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: pb_staging_judge_db_only
    volumes:
      - cz_pb_staging_judge_pg:/var/lib/postgresql/data
    networks: [cz_pb_staging_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U judge0 -d judge0"]
      interval: 5s
      timeout: 5s
      retries: 30

  judge-redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "no"]
    networks: [cz_pb_staging_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  judge-server:
    image: judge0/judge0:1.13.1
    command: ["./scripts/server"]
    depends_on:
      judge-db:
        condition: service_healthy
      judge-redis:
        condition: service_healthy
    environment:
      REDIS_HOST: judge-redis
      POSTGRES_HOST: judge-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: pb_staging_judge_db_only
      SECRET_KEY_BASE: pb-staging-judge-secret-key-base-only-0123456789abcdef
      ENABLE_WAIT_RESULT: "true"
      ENABLE_NETWORK: "false"
      ALLOW_ENABLE_NETWORK: "false"
      ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "false"
      ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "false"
      ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "false"
      ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "false"
      MAX_CPU_TIME_LIMIT: "15"
      MAX_WALL_TIME_LIMIT: "20"
      MAX_MEMORY_LIMIT: "512000"
      RAILS_ENV: production
      RAILS_MAX_THREADS: "2"
      RAILS_SERVER_PROCESSES: "1"
      COUNT: "1"
    ports:
      - "127.0.0.1:2360:2358"
    privileged: true
    networks: [cz_pb_staging_net]

  judge-worker:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    depends_on:
      judge-server:
        condition: service_started
    environment:
      REDIS_HOST: judge-redis
      POSTGRES_HOST: judge-db
      POSTGRES_DB: judge0
      POSTGRES_USER: judge0
      POSTGRES_PASSWORD: pb_staging_judge_db_only
      SECRET_KEY_BASE: pb-staging-judge-secret-key-base-only-0123456789abcdef
      ENABLE_WAIT_RESULT: "true"
      ENABLE_NETWORK: "false"
      ALLOW_ENABLE_NETWORK: "false"
      ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "false"
      ALLOW_ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT: "false"
      ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "false"
      ALLOW_ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT: "false"
      MAX_CPU_TIME_LIMIT: "15"
      MAX_WALL_TIME_LIMIT: "20"
      MAX_MEMORY_LIMIT: "512000"
      RAILS_ENV: production
      COUNT: "1"
    privileged: true
    networks: [cz_pb_staging_net]

  api:
    image: ${PB_STAGING_BACKEND_IMAGE:-coderzclub-backend:pb-staging}
    ports:
      - "127.0.0.1:18090:8080"
      - "127.0.0.1:18091:8081"
    environment: &app_env
      SPRING_PROFILES_ACTIVE: api
      SERVER_PORT: "8080"
      MANAGEMENT_SERVER_PORT: "8081"
      MONGODB_URI: mongodb://mongo:27017/coderzclub_pb_staging?replicaSet=rs0
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/coderzclub_pb_staging?replicaSet=rs0
      SPRING_DATA_MONGODB_DATABASE: coderzclub_pb_staging
      JWT_SECRET: pb-staging-jwt-secret-only-do-not-reuse-0123456789abcdef0123456789abcdef
      APP_REQUIRE_SECURE_SECRETS: "true"
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      SPRING_REDIS_PASSWORD: pb_staging_redis_only_local
      SPRING_REDIS_DATABASE: "0"
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      SPRING_DATA_REDIS_PASSWORD: pb_staging_redis_only_local
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USERNAME: pb_staging_user
      RABBITMQ_PASSWORD: pb_staging_rabbit_only_local
      RABBITMQ_VHOST: /cz-pb-staging
      JUDGE0_API_URL: http://judge-server:2358/submissions
      JUDGE0_AUTH_MODE: SELF_HOSTED
      JUDGE0_WAIT: "true"
      JUDGE0_CONNECT_TIMEOUT_SECONDS: "20"
      JUDGE0_TIMEOUT_SECONDS: "120"
      # Runtime caps aligned to Judge0 1.13.1 MAX_* (compile uses MAX_* only; no compile_time_limit API field).
      JUDGE0_MAX_CPU_TIME_LIMIT_SECONDS: "15"
      JUDGE0_SERVER_MAX_CPU_TIME_LIMIT_SECONDS: "15"
      JUDGE0_WALL_TIME_LIMIT_SECONDS: "20"
      JUDGE0_SERVER_MAX_WALL_TIME_LIMIT_SECONDS: "20"
      JUDGE0_QUEUE_SLACK_SECONDS: "15"
      JUDGE0_SERVER_MAX_MEMORY_LIMIT_KB: "512000"
      SUBMISSION_MAX_EXECUTION_TIME_SECONDS: "15"
      SUBMISSION_MAX_MEMORY_KB: "262144"
      WORKER_LEASE_DURATION_SECONDS: "180"
      WORKER_HEARTBEAT_INTERVAL_SECONDS: "45"
      APP_BACKEND_URL: http://127.0.0.1:18090
      APP_FRONTEND_URL: http://127.0.0.1:15190
      APP_CORS_ALLOWED_ORIGINS: http://127.0.0.1:15190
      SPRING_MAIL_ENABLED: "false"
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
      SUBMISSION_LIMIT_REDIS_FAIL_OPEN: "false"
      # Local problem-bank validation only — isolated staging, not production.
      SUBMISSION_LIMIT_DAILY: "100000"
      SUBMISSION_LIMIT_PER_PROBLEM_DAILY: "1000"
      # Must be >0: Redis SET PX 0 is invalid and trips REDIS_UNAVAILABLE (HTTP 503).
      SUBMISSION_LIMIT_COOLDOWN_MS: "50"
      SUBMISSION_QUEUE_NAME: cz.pb.staging.submissions
      SUBMISSION_QUEUE_EXCHANGE: cz.pb.staging.submissions.exchange
      SUBMISSION_QUEUE_RETRY_NAME: cz.pb.staging.submissions.retry
      SUBMISSION_QUEUE_DLQ_NAME: cz.pb.staging.submissions.dlq
      CONTEST_RUN_QUEUE_NAME: cz.pb.staging.contest-runs
      CONTEST_RUN_QUEUE_EXCHANGE: cz.pb.staging.contest-runs.exchange
      CONTEST_GLOBAL_ENABLED: "false"
      APP_CUSTOM_DOMAINS_PUBLIC_RESOLUTION_ENABLED: "false"
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      judge-server:
        condition: service_started
    networks: [cz_pb_staging_net]

  worker:
    image: ${PB_STAGING_BACKEND_IMAGE:-coderzclub-backend:pb-staging}
    environment:
      <<: *app_env
      SPRING_PROFILES_ACTIVE: worker
      WORKER_ENABLED: "true"
      WORKER_MAX_GLOBAL_JUDGE0_CONCURRENCY: "2"
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      judge-server:
        condition: service_started
      api:
        condition: service_started
    networks: [cz_pb_staging_net]

networks:
  cz_pb_staging_net:
    name: cz_pb_staging_net

volumes:
  cz_pb_staging_mongo:
    name: cz_pb_staging_mongo
  cz_pb_staging_redis:
    name: cz_pb_staging_redis
  cz_pb_staging_rabbit:
    name: cz_pb_staging_rabbit
  cz_pb_staging_judge_pg:
    name: cz_pb_staging_judge_pg
