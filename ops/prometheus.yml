global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: coderzclub-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [api:8081]
  - job_name: redis
    static_configs:
      - targets: [redis-exporter:9121]
  - job_name: rabbitmq
    static_configs:
      - targets: [rabbitmq:15692]
