# Real GCP-like fixture: NO policy keys in compose; env via judge0.conf only.
services:
  db:
    image: postgres:13
    volumes:
      - judge0-pg:/var/lib/postgresql/data
    env_file:
      - judge0.conf
  redis:
    image: redis:7.2-alpine
  server:
    image: judge0/judge0:1.13.1
    command: ["./scripts/server"]
    env_file:
      - judge0.conf
    ports:
      - "10.20.0.6:2358:2358"
    privileged: true
    depends_on:
      - db
      - redis
  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    env_file:
      - judge0.conf
    privileged: true
    depends_on:
      - db
      - redis
volumes:
  judge0-pg:
