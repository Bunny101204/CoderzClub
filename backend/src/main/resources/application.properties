# MongoDB Atlas Configuration
# MongoDB Atlas Configuration
# Replace the username/password below with your Atlas user credentials, or override
# the entire URI via the MONGODB_URI environment variable when running in Codespaces.
# e.g. `export MONGODB_URI="mongodb+srv://user:pass@cluster0..."`
spring.data.mongodb.uri=${MONGODB_URI:}
spring.data.mongodb.database=coderzclub

# MongoDB Connection Settings
spring.data.mongodb.auto-index-creation=true
# Mongo transactions require a replica set (MongoDB Atlas deployments provide this).

# JWT secret (compatible with JWT library 0.11.5)
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# Server Configuration
server.port=8080
server.tomcat.max-http-form-post-size=2MB
server.tomcat.max-swallow-size=2MB
server.tomcat.max-http-post-size=2MB
spring.servlet.multipart.max-request-size=2MB
spring.servlet.multipart.max-file-size=2MB

# Allow circular references (fallback)
spring.main.allow-circular-references=true

# Email configuration (optional in local/dev mode)
# Configure these to your SMTP provider or mail relay.
spring.mail.enabled=${SPRING_MAIL_ENABLED:false}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=false
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=${SPRING_MAIL_TEST_CONNECTION:false}
app.email.from=${APP_EMAIL_FROM:${SPRING_MAIL_USERNAME:}}
app.backend.url=${APP_BACKEND_URL:http://localhost:8080}
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5173}
# Judge0 execution key. Keep this secret and do not commit it to Git.
# Set judge0.api.key or JUDGE0_API_KEY in a local .env file or environment.
# Do not expose this key client-side.
judge0.api.key=${JUDGE0_API_KEY:}
app.verification.token-expiration-ms=86400000
app.password-reset.token-expiration-ms=3600000

# Submission Security & Performance Limits
# Code size validation
submission.max-code-length=${SUBMISSION_MAX_CODE_LENGTH:100000}
submission.min-code-length=${SUBMISSION_MIN_CODE_LENGTH:1}

# Output truncation limits (bytes)
submission.max-stdout-length=${SUBMISSION_MAX_STDOUT_LENGTH:1048576}
submission.max-stderr-length=${SUBMISSION_MAX_STDERR_LENGTH:262144}
submission.max-compile-output-length=${SUBMISSION_MAX_COMPILE_OUTPUT_LENGTH:262144}

# Testcase limits
submission.max-test-cases-per-problem=${SUBMISSION_MAX_TEST_CASES_PER_PROBLEM:500}
submission.max-test-case-input-length=${SUBMISSION_MAX_TEST_CASE_INPUT_LENGTH:1048576}
submission.max-test-case-output-length=${SUBMISSION_MAX_TEST_CASE_OUTPUT_LENGTH:1048576}

# Execution limits
submission.max-execution-time-seconds=${SUBMISSION_MAX_EXECUTION_TIME_SECONDS:15}
submission.max-memory-kb=${SUBMISSION_MAX_MEMORY_KB:262144}

# Request body size limit
server.tomcat.max-http-post-size=52428800
server.tomcat.max-swallow-size=52428800

# Logging
logging.level.com.coderzclub=${LOG_LEVEL_APP:INFO}
logging.level.org.springframework.security=${LOG_LEVEL_SECURITY:WARN}
logging.level.org.springframework.data.mongodb=${LOG_LEVEL_MONGO:WARN}

# Redis configuration
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.password=${SPRING_REDIS_PASSWORD:}

# RabbitMQ submission queue. API instances publish; only the worker profile consumes.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
submission.events.channel=${SUBMISSION_EVENTS_CHANNEL:coderzclub.submission.events}
submission.events.heartbeat-ms=${SUBMISSION_EVENTS_HEARTBEAT_MS:30000}
submission.events.retry-ms=${SUBMISSION_EVENTS_RETRY_MS:5000}
submission.events.ticket-ttl-seconds=${SUBMISSION_EVENTS_TICKET_TTL_SECONDS:90}
leaderboard.cache-ttl-seconds=${LEADERBOARD_CACHE_TTL_SECONDS:15}

worker.retry-delay-seconds=${WORKER_RETRY_DELAY_SECONDS:30}
worker.retry-max-delay-seconds=${WORKER_RETRY_MAX_DELAY_SECONDS:900}
worker.retry-jitter-seconds=${WORKER_RETRY_JITTER_SECONDS:5}
worker.max-testcase-concurrency=${WORKER_MAX_TESTCASE_CONCURRENCY:2}
worker.max-global-judge0-concurrency=${WORKER_MAX_GLOBAL_JUDGE0_CONCURRENCY:8}
worker.max-per-language-judge0-concurrency=${WORKER_MAX_PER_LANGUAGE_JUDGE0_CONCURRENCY:2}
worker.stop-hidden-on-failure=${WORKER_STOP_HIDDEN_ON_FAILURE:true}

submission.queue.name=${SUBMISSION_QUEUE_NAME:coderzclub.submissions}
submission.queue.exchange=${SUBMISSION_QUEUE_EXCHANGE:coderzclub.submissions.exchange}
submission.queue.routing-key=${SUBMISSION_QUEUE_ROUTING_KEY:submission}
submission.queue.retry-routing-key=${SUBMISSION_QUEUE_RETRY_ROUTING_KEY:submission.retry}
submission.queue.dead-letter-routing-key=${SUBMISSION_QUEUE_DLQ_ROUTING_KEY:submission.dlq}
submission.queue.dlq-name=${SUBMISSION_QUEUE_DLQ_NAME:coderzclub.submissions.dlq}
submission.queue.retry-name=${SUBMISSION_QUEUE_RETRY_NAME:coderzclub.submissions.retry}
submission.queue.durable=${SUBMISSION_QUEUE_DURABLE:true}
submission.queue.prefetch=${SUBMISSION_QUEUE_PREFETCH:10}
submission.queue.concurrency=${SUBMISSION_QUEUE_CONCURRENCY:2}
submission.queue.max-length=${SUBMISSION_QUEUE_MAX_LENGTH:10000}
submission.queue.retry-delay-ms=${SUBMISSION_QUEUE_RETRY_DELAY_MS:5000}
submission.queue.max-depth=${SUBMISSION_QUEUE_MAX_DEPTH:10000}

# Submission limits
submission.daily=${SUBMISSION_LIMIT_DAILY:100}
submission.per-problem-daily=${SUBMISSION_LIMIT_PER_PROBLEM_DAILY:50}
submission.cooldown-ms=${SUBMISSION_LIMIT_COOLDOWN_MS:2000}
# Fail closed by default; enable only for local development without Redis.
submission.redis-fail-open=${SUBMISSION_LIMIT_REDIS_FAIL_OPEN:false}
submission.time-zone=${SUBMISSION_LIMIT_TIME_ZONE:UTC}
submission.outbox.poll-ms=${SUBMISSION_OUTBOX_POLL_MS:1000}
submission.outbox.repair-ms=${SUBMISSION_OUTBOX_REPAIR_MS:30000}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=${MANAGEMENT_HEALTH_DETAILS:never}
management.metrics.tags.application=coderzclub
management.metrics.distribution.percentiles-histogram.http.server.requests=true
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId} jobId=%X{jobId} userId=%X{userId} problemId=%X{problemId} attempt=%X{attemptCount} workerId=%X{workerId}] %logger{36} - %msg%n
submission.retention.cleanup-enabled=${SUBMISSION_RETENTION_CLEANUP_ENABLED:false}
submission.retention.dry-run=${SUBMISSION_RETENTION_DRY_RUN:true}
submission.retention.job-days=${SUBMISSION_RETENTION_JOB_DAYS:7}

judge0.api.url=${JUDGE0_API_URL:}