# Worker has its own embedded web and management ports so it can run beside the API.
server.port=${WORKER_SERVER_PORT:8082}
management.server.port=${WORKER_MANAGEMENT_SERVER_PORT:8083}
# Per-worker-JVM Judge0 budget. Matches default Rabbit listener concurrency (2).
# Public testcase thread pool (worker.max-testcase-concurrency=2) cannot exceed this semaphore.
# Independent of JUDGE0_API_MAX_CONCURRENCY. Not a cluster-wide Judge0 capacity.
worker.max-global-judge0-concurrency=${WORKER_MAX_GLOBAL_JUDGE0_CONCURRENCY:2}
