# Per-API-JVM Judge0 budget for Run All / custom stdin. Independent of worker JVMs.
# Does not fall back to WORKER_MAX_GLOBAL_JUDGE0_CONCURRENCY.
# Peak Run traffic ~= api_replicas * this value. Not a cluster-wide Judge0 capacity.
worker.max-global-judge0-concurrency=${JUDGE0_API_MAX_CONCURRENCY:2}
