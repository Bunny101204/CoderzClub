    <script>
      (function () {
        try {
          var theme = localStorage.getItem("coderzclub-theme");
          if (theme === "light") document.documentElement.classList.remove("dark");
          else document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
